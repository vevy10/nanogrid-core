security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
            logout:
                path: /api/logout

    access_control:
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout, roles: ROLE_USER }
        - { path: ^/api/me, roles: ROLE_USER }
        - { path: ^/api/sites$, methods: [POST], roles: ROLE_USER }
        - { path: ^/api/sites/\d+$, methods: [PUT], roles: ROLE_USER }
        - { path: ^/api/equipment$, methods: [POST], roles: ROLE_USER }
        - { path: ^/api/equipment/\d+$, methods: [PUT], roles: ROLE_USER }
        - { path: ^/api/households$, methods: [POST], roles: ROLE_USER }
        - { path: ^/api/incidents$, methods: [POST], roles: ROLE_USER }
        - { path: ^/api/site-contracts$, methods: [POST], roles: ROLE_USER }
        - { path: ^/api/site-contracts/\d+$, methods: [PUT], roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10